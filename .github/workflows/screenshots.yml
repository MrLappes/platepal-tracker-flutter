name: Store screenshots (2400)

# Captures the Play screenshots on a Pixel-7-sized emulator (1080x2400) and
# uploads them as an artifact. Manual only; nothing is published to Play.

on:
  workflow_dispatch:
    inputs:
      locale:
        description: UI locale
        type: choice
        options: [en, de, es]
        default: en

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build apk --debug

      - name: KVM availability
        run: ls -l /dev/kvm || echo "NO KVM"

      - name: Boot emulator and capture
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: >-
            -no-snapshot -no-window -gpu swiftshader_indirect -noaudio
            -no-boot-anim
          script: |
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            bash tool/screenshots/push_demo_data.sh ${{ inputs.locale }}
            sleep 4
            python3 tool/screenshots/capture_2400.py shots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ inputs.locale }}
          path: shots/
          if-no-files-found: warn
